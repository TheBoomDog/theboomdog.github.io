name: Update weekly reader rankings

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'
      timezone: "America/Chicago"

permissions:
  contents: write

concurrency:
  group: novelhub-weekly-reader-rankings
  cancel-in-progress: false

jobs:
  weekly-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out NovelHub
        uses: actions/checkout@v4
      - name: Validate analytics aggregation
        run: python3 -m unittest discover -s tests -p 'test_reader_rankings.py' -v
      - name: Build weekly leaderboard
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE || 'theboomdog' }}
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: python3 scripts/update_reader_rankings.py
      - name: Publish measured rankings and analytics config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings.js data/analytics-config.js
          if git diff --cached --quiet; then
            echo "No new ranking data (analytics may not be connected yet)."
          else
            git commit -m "Publish weekly reader rankings"
            git push
          fi
