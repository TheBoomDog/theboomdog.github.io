name: Rebuild shared novel catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/build_catalog.py'

permissions:
  contents: write

concurrency:
  group: novelhub-catalog-builder
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest catalog source files
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild novel catalog
        run: python3 scripts/build_catalog.py
      - name: Verify catalog compiles
        run: node --check data/catalog.js
      - name: Commit bundle if sources changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.js
          if git diff --cached --quiet; then
            echo "All novel data already synchronized."
          else
            git commit -m "Rebuild shared novel catalog"
            git push
          fi
